<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>بريق — Concept 2: Royal Shine</title>
  <rect width="600" height="600" fill="#0B2340"/>

  <!-- sparkle crest -->
  <g transform="translate(300,190)">
    <path d="M0 -96 C 11 -30 30 -11 96 0 C 30 11 11 30 0 96 C -11 30 -30 11 -96 0 C -30 -11 -11 -30 0 -96 Z"
          fill="#E4B958"/>
    <g transform="translate(84,-52) scale(.32)">
      <path d="M0 -96 C 11 -30 30 -11 96 0 C 30 11 11 30 0 96 C -11 30 -30 11 -96 0 C -30 -11 -11 -30 0 -96 Z"
            fill="#E4B958" opacity=".8"/>
    </g>
    <g transform="translate(-92,44) scale(.22)">
      <path d="M0 -96 C 11 -30 30 -11 96 0 C 30 11 11 30 0 96 C -11 30 -30 11 -96 0 C -30 -11 -11 -30 0 -96 Z"
            fill="#E4B958" opacity=".65"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="410" text-anchor="middle" direction="rtl"
        font-family="'Noto Naskh Arabic','Amiri','Cairo','Segoe UI','Geeza Pro',serif"
        font-size="150" font-weight="700" fill="#FFFFFF" letter-spacing="2">بريق</text>

  <line x1="170" y1="452" x2="430" y2="452" stroke="#E4B958" stroke-width="2" opacity=".7"/>

  <text x="300" y="500" text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="400" fill="#E4B958" letter-spacing="18">BARIQ</text>

  <text x="300" y="546" text-anchor="middle" direction="rtl"
        font-family="'Cairo','Tajawal','Segoe UI','Geeza Pro',sans-serif"
        font-size="22" font-weight="400" fill="#9FB4CC" letter-spacing="1">نظافة فاخرة لمواعينك</text>
</svg>
