package_rename_config:
  android:
    app_name: "KitchenIn" # Display name
    package_name: "com.kitchenin.app" # Package name


  ios:
    app_name: "KitchenIn" # Display name
    bundle_name: "KitchenIn" # Bundle name
    package_name: "com.kitchenin.app" # Product Bundle Identifier


  web:
    app_name: "KitchenIn" # App title & PWA name
    short_app_name: "App" # PWA short name (defaults to app_name)
    description: "Best App for food delivery services" # Web app description

